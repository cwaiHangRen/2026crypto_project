[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "gm-provenance"
version = "0.1.0"
description = "国密内容凭证与媒体水印的本地可复现原型"
requires-python = ">=3.11"
dependencies = [
  "numpy>=2.0,<3", "Pillow>=11,<13", "scipy>=1.14,<2", "reedsolo==1.7.0",
  "rfc8785==0.1.4", "fastapi>=0.115,<1", "uvicorn>=0.30,<1",
  "python-multipart>=0.0.20,<1", "pypdfium2>=4.30,<6", "reportlab>=4.2,<5", "pypdf>=5,<7"
]

[project.optional-dependencies]
test = ["pytest>=8,<10", "httpx>=0.27,<1", "gmssl==3.2.2"]

[project.scripts]
gm-provenance = "gm_provenance.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
gm_provenance = ["ui/*.html", "ui/*.css", "ui/*.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
